# The kit's test suite on the two Perls that matter: the target (Git for Windows' cygwin Perl, which GitHub's
# Windows runners ship at C:\Program Files\Git\usr\bin\perl.exe) and a Linux system Perl for contrast.
# Core Perl only, nothing to install. data/ is git-ignored and never reaches GitHub.
name: tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  git-for-windows-perl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: git identity (daily.pl commit is under test)
        shell: bash
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: perl version
        shell: bash
        run: '"/c/Program Files/Git/usr/bin/perl.exe" -v | sed -n 2p'
      - name: test suite
        shell: bash
        run: '"/c/Program Files/Git/usr/bin/perl.exe" tests/run.pl -v'    # every suite in parallel, one line each; failing suites in full
      - name: help covers every command and message
        shell: bash
        run: '"/c/Program Files/Git/usr/bin/perl.exe" agile.pl help --check'
      - name: syntax check every script under the target Perl
        shell: bash
        run: |
          for f in bin/*.pl agile.pl sim/*.pl sim/status-metrics/*.pl tools/idef0/idef0.pl tools/memo/md2memo.pl tools/sysml/sysml.pl tools/sysml/model.pl tools/sysml/v1v2.pl tools/sysml/doors2v2.pl tools/sysml/views/*.pl tools/sysml/views/binder/*.pl drills/drill.pl drills/toolbelt.pl tests/run.pl; do "/c/Program Files/Git/usr/bin/perl.exe" -Ilib -c "$f" || exit 1; done
      - name: training replay (exercises daily.pl, git and the IDEF0 toolkit end to end)
        shell: bash
        run: |
          git config --global user.email ci@example.invalid && git config --global user.name ci
          "/c/Program Files/Git/usr/bin/perl.exe" sim/training.pl --fast > /dev/null
          test -s docs/TRAINING.html
  linux-perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: perlcritic (gentle severity; CPAN, so Linux CI only -- the target has no CPAN)
        run: |
          sudo apt-get install -y -qq libperl-critic-perl > /dev/null
          perlcritic --severity 5 --quiet lib bin agile.pl sim tools/idef0/idef0.pl
      - name: git identity (daily.pl commit is under test)
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: test suite
        run: perl tests/run.pl -v
