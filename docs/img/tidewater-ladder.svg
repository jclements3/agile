<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold">The ladder of fidelity: volume at the bottom, truth at the top</text>
  <!-- rails -->
  <line x1="200" y1="50" x2="200" y2="370" stroke="#000" stroke-width="4"/>
  <line x1="620" y1="50" x2="620" y2="370" stroke="#000" stroke-width="4"/>
  <!-- rungs: y positions, top = truth -->
  <g stroke="#000" stroke-width="3">
    <line x1="200" y1="80" x2="620" y2="80"/><line x1="200" y1="145" x2="620" y2="145"/><line x1="200" y1="210" x2="620" y2="210"/>
    <line x1="200" y1="275" x2="620" y2="275"/><line x1="200" y1="340" x2="620" y2="340"/>
  </g>
  <g text-anchor="middle">
    <rect x="245" y="62" width="330" height="36" fill="#fff" stroke="#000"/><text x="410" y="79" font-weight="bold">Sea trials</text><text x="410" y="93" font-size="11">a real buoy, real weather, a few a year</text>
    <rect x="245" y="127" width="330" height="36" fill="#fff" stroke="#000"/><text x="410" y="144" font-weight="bold">Harbor and shore tests</text><text x="410" y="158" font-size="11">real stations, real link, end to end, no open sea</text>
    <rect x="245" y="192" width="330" height="36" fill="#fff" stroke="#000"/><text x="410" y="209" font-weight="bold">Bench in the loop (SIL / HIL)</text><text x="410" y="223" font-size="11">real logger and modem against a simulated sea</text>
    <rect x="245" y="257" width="330" height="36" fill="#fff" stroke="#000"/><text x="410" y="274" font-weight="bold">Simulation</text><text x="410" y="288" font-size="11">the network and its weather, thousands of runs a night</text>
    <rect x="245" y="322" width="330" height="36" fill="#fff" stroke="#000"/><text x="410" y="339" font-weight="bold">Model checks (MIL)</text><text x="410" y="353" font-size="11">grammar, lint, trace, VCRM on every merge request</text>
  </g>
  <!-- left: volume arrow -->
  <line x1="120" y1="350" x2="120" y2="70" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="110" y="215" text-anchor="middle" transform="rotate(-90 110 215)" font-size="12">fewer runs, more truth</text>
  <!-- right: calibrates arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <g stroke="#000" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M630,85 C690,100 690,130 630,140" marker-end="url(#a)"/>
    <path d="M630,150 C690,165 690,195 630,205" marker-end="url(#a)"/>
    <path d="M630,215 C690,230 690,260 630,270" marker-end="url(#a)"/>
    <path d="M630,280 C690,295 690,325 630,335" marker-end="url(#a)"/>
  </g>
  <text x="700" y="210" font-size="12">each rung's</text><text x="700" y="226" font-size="12">measured data</text><text x="700" y="242" font-size="12">calibrates the</text><text x="700" y="258" font-size="12">rung below it</text>
</svg>
