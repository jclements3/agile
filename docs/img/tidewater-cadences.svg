<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold">Three segments, three cadences, one set of integrated baselines</text>
  <!-- time axis -->
  <line x1="190" y1="300" x2="870" y2="300" stroke="#000" stroke-width="1"/>
  <g font-size="11" text-anchor="middle">
    <text x="190" y="318">Oct 2026</text><text x="303" y="318">Jan 2027</text><text x="416" y="318">Apr 2027</text>
    <text x="530" y="318">Jul 2027</text><text x="643" y="318">Oct 2027</text><text x="756" y="318">Jan 2028</text><text x="860" y="318">Mar 2028</text>
  </g>
  <!-- lanes -->
  <g font-weight="bold" font-size="13">
    <text x="20" y="80">Stations and buoys</text><text x="20" y="96" font-weight="normal" font-size="11">hardware, long-lead</text>
    <text x="20" y="160">Telemetry</text><text x="20" y="176" font-weight="normal" font-size="11">mixed: radio and firmware</text>
    <text x="20" y="240">Data center</text><text x="20" y="256" font-weight="normal" font-size="11">software: continuous</text>
  </g>
  <line x1="190" y1="120" x2="870" y2="120" stroke="#bbb" stroke-dasharray="2 3"/>
  <line x1="190" y1="200" x2="870" y2="200" stroke="#bbb" stroke-dasharray="2 3"/>
  <!-- hardware V cycles: long grey bars -->
  <rect x="195" y="70" width="320" height="22" fill="#888" stroke="#000"/><text x="355" y="86" text-anchor="middle" fill="#fff" font-size="12">Block 1 build, install, check</text>
  <rect x="470" y="98" width="300" height="16" fill="#cfcfcf" stroke="#000"/><text x="620" y="111" text-anchor="middle" font-size="11">Block 2: drifting buoys</text>
  <!-- telemetry: medium bars and ticks -->
  <rect x="195" y="150" width="150" height="18" fill="#cfcfcf" stroke="#000"/>
  <rect x="360" y="150" width="150" height="18" fill="#cfcfcf" stroke="#000"/>
  <rect x="525" y="150" width="150" height="18" fill="#cfcfcf" stroke="#000"/>
  <rect x="690" y="150" width="150" height="18" fill="#cfcfcf" stroke="#000"/>
  <g stroke="#000" stroke-width="2">
    <line x1="240" y1="172" x2="240" y2="184"/><line x1="300" y1="172" x2="300" y2="184"/><line x1="410" y1="172" x2="410" y2="184"/>
    <line x1="470" y1="172" x2="470" y2="184"/><line x1="580" y1="172" x2="580" y2="184"/><line x1="640" y1="172" x2="640" y2="184"/>
    <line x1="740" y1="172" x2="740" y2="184"/><line x1="800" y1="172" x2="800" y2="184"/>
  </g>
  <!-- software: a tick every two weeks -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="195" y1="228" x2="195" y2="250"/><line x1="212" y1="228" x2="212" y2="250"/><line x1="230" y1="228" x2="230" y2="250"/><line x1="247" y1="228" x2="247" y2="250"/>
    <line x1="265" y1="228" x2="265" y2="250"/><line x1="282" y1="228" x2="282" y2="250"/><line x1="300" y1="228" x2="300" y2="250"/><line x1="317" y1="228" x2="317" y2="250"/>
    <line x1="335" y1="228" x2="335" y2="250"/><line x1="352" y1="228" x2="352" y2="250"/><line x1="370" y1="228" x2="370" y2="250"/><line x1="387" y1="228" x2="387" y2="250"/>
    <line x1="405" y1="228" x2="405" y2="250"/><line x1="422" y1="228" x2="422" y2="250"/><line x1="440" y1="228" x2="440" y2="250"/><line x1="457" y1="228" x2="457" y2="250"/>
    <line x1="475" y1="228" x2="475" y2="250"/><line x1="492" y1="228" x2="492" y2="250"/><line x1="510" y1="228" x2="510" y2="250"/><line x1="527" y1="228" x2="527" y2="250"/>
    <line x1="545" y1="228" x2="545" y2="250"/><line x1="562" y1="228" x2="562" y2="250"/><line x1="580" y1="228" x2="580" y2="250"/><line x1="597" y1="228" x2="597" y2="250"/>
    <line x1="615" y1="228" x2="615" y2="250"/><line x1="632" y1="228" x2="632" y2="250"/><line x1="650" y1="228" x2="650" y2="250"/><line x1="667" y1="228" x2="667" y2="250"/>
    <line x1="685" y1="228" x2="685" y2="250"/><line x1="702" y1="228" x2="702" y2="250"/><line x1="720" y1="228" x2="720" y2="250"/><line x1="737" y1="228" x2="737" y2="250"/>
    <line x1="755" y1="228" x2="755" y2="250"/><line x1="772" y1="228" x2="772" y2="250"/><line x1="790" y1="228" x2="790" y2="250"/><line x1="807" y1="228" x2="807" y2="250"/>
    <line x1="825" y1="228" x2="825" y2="250"/><line x1="842" y1="228" x2="842" y2="250"/><line x1="860" y1="228" x2="860" y2="250"/>
  </g>
  <!-- integrated baselines -->
  <g stroke="#000" stroke-width="2.5" stroke-dasharray="7 4">
    <line x1="290" y1="50" x2="290" y2="300"/><line x1="530" y1="50" x2="530" y2="300"/><line x1="700" y1="50" x2="700" y2="300"/><line x1="862" y1="50" x2="862" y2="300"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="290" y="46">baseline-0</text><text x="530" y="46">baseline-1</text><text x="700" y="46">baseline-2</text><text x="845" y="46">baseline-3</text>
  </g>
  <!-- legend -->
  <g font-size="11">
    <rect x="190" y="332" width="22" height="10" fill="#888" stroke="#000"/><text x="218" y="341">hardware block</text>
    <rect x="330" y="332" width="22" height="10" fill="#cfcfcf" stroke="#000"/><text x="358" y="341">firmware or radio cycle</text>
    <line x1="510" y1="331" x2="510" y2="343" stroke="#000" stroke-width="1.5"/><text x="518" y="341">software release (each sprint)</text>
    <line x1="700" y1="337" x2="730" y2="337" stroke="#000" stroke-width="2.5" stroke-dasharray="7 4"/><text x="736" y="341">integrated baseline</text>
  </g>
</svg>
