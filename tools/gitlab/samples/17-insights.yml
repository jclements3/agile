# .gitlab/insights.yml -- generated by gitlab.pl setup from .gitlab/project.conf ([labels], [windchill], [insights]).
# Edit project.conf and re-run setup, not this file. GitLab reads it from the default branch (Analyze > Insights,
# Ultimate). Insights groups by day, week or month, not by sprint: the charts are weekly, the last 12 weeks.
flow:
  title: "Flow of work"
  charts:
    - title: "Open issues by board column"
      description: "Open issues created each week, split by their workflow:: label (the board columns)"
      type: stacked-bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: opened
          collection_labels:
            - "workflow::ready"
            - "workflow::in-progress"
            - "workflow::review"
            - "workflow::blocked"
            - "workflow::done"
          group_by: week
          period_limit: 12
    - title: "Issues created per week"
      description: "Every issue created each week, open or closed"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: all
          group_by: week
          period_limit: 12
          period_field: created_at
    - title: "Issues closed per week"
      description: "Issues closed each week (compare with created: is the backlog growing?)"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: closed
          group_by: week
          period_limit: 12
          period_field: closed_at
    - title: "Merge requests merged per week"
      description: "Changes that reached the target branch each week"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: merge_request
          issuable_state: merged
          group_by: week
          period_limit: 12
          period_field: merged_at
quality:
  title: "Defects"
  charts:
    - title: "Open defects by severity"
      description: "Open defects created each week, split by severity::"
      type: stacked-bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: opened
          filter_labels:
            - "type::defect"
          collection_labels:
            - "severity::1"
            - "severity::2"
            - "severity::3"
          group_by: week
          period_limit: 12
    - title: "Defects closed per week"
      description: "Defects closed each week"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: closed
          filter_labels:
            - "type::defect"
          group_by: week
          period_limit: 12
          period_field: closed_at
requests:
  title: "Requests from Windchill"
  charts:
    - title: "Requests received per week"
      description: "Issues made from Windchill requests (source::windchill), by the week they arrived"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: all
          filter_labels:
            - "source::windchill"
          group_by: week
          period_limit: 12
          period_field: created_at
    - title: "Requests closed per week"
      description: "Windchill requests the team finished each week (gitlab.pl windchill status sends them back)"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: closed
          filter_labels:
            - "source::windchill"
          group_by: week
          period_limit: 12
          period_field: closed_at
    - title: "Open requests"
      description: "Windchill requests still open, by the week they arrived"
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: opened
          filter_labels:
            - "source::windchill"
          group_by: week
          period_limit: 12
work:
  title: "Where the time goes"
  charts:
    - title: "Issues closed by kind of work"
      description: "Closed issues each week, split by work:: (engineering, platform, learning)"
      type: stacked-bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: closed
          collection_labels:
            - "work::engineering"
            - "work::platform"
            - "work::learning"
          group_by: week
          period_limit: 12
          period_field: closed_at
