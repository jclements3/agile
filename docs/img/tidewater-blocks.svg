<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="346" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold">Blocks, not one big Vee: each block a complete, verified, fieldable baseline</text>
  <!-- Block 1 V -->
  <polyline points="40,60 170,240 300,60" fill="none" stroke="#000" stroke-width="10" stroke-opacity="0.75"/>
  <text x="170" y="270" text-anchor="middle" font-weight="bold">Block 1</text>
  <text x="170" y="286" text-anchor="middle" font-size="11">moored buoys,</text><text x="170" y="300" text-anchor="middle" font-size="11">shore stations</text>
  <!-- Block 2 V, overlapping -->
  <polyline points="240,90 370,240 500,90" fill="none" stroke="#000" stroke-width="10" stroke-opacity="0.45"/>
  <text x="370" y="270" text-anchor="middle" font-weight="bold">Block 2</text>
  <text x="370" y="286" text-anchor="middle" font-size="11">drifting buoys</text><text x="370" y="300" text-anchor="middle" font-size="11">(drop 4, NWM-CR-0021)</text>
  <!-- Block 3 V -->
  <polyline points="440,120 570,240 700,120" fill="none" stroke="#000" stroke-width="10" stroke-opacity="0.25"/>
  <text x="570" y="270" text-anchor="middle" font-weight="bold">Block 3</text>
  <text x="570" y="286" text-anchor="middle" font-size="11">partner data sharing</text><text x="570" y="300" text-anchor="middle" font-size="11">(drop 6)</text>
  <!-- fielding markers -->
  <g font-size="11">
    <polygon points="300,52 308,60 300,68 292,60" fill="#000"/><text x="312" y="56">fielded</text>
    <polygon points="500,82 508,90 500,98 492,90" fill="#000"/><text x="512" y="86">fielded</text>
    <polygon points="700,112 708,120 700,128 692,120" fill="#000"/><text x="712" y="116">fielded</text>
  </g>
  <text x="720" y="200" font-size="11" font-style="italic">Block 2 design starts</text>
  <text x="720" y="214" font-size="11" font-style="italic">while Block 1 is still</text>
  <text x="720" y="228" font-size="11" font-style="italic">in verification.</text>
  <!-- sprint ticks -->
  <line x1="40" y1="316" x2="860" y2="316" stroke="#000"/>
  <g stroke="#000">
    <line x1="40" y1="310" x2="40" y2="322"/><line x1="61" y1="310" x2="61" y2="322"/><line x1="82" y1="310" x2="82" y2="322"/><line x1="103" y1="310" x2="103" y2="322"/>
    <line x1="124" y1="310" x2="124" y2="322"/><line x1="145" y1="310" x2="145" y2="322"/><line x1="166" y1="310" x2="166" y2="322"/><line x1="187" y1="310" x2="187" y2="322"/>
    <line x1="208" y1="310" x2="208" y2="322"/><line x1="229" y1="310" x2="229" y2="322"/><line x1="250" y1="310" x2="250" y2="322"/><line x1="271" y1="310" x2="271" y2="322"/>
    <line x1="292" y1="310" x2="292" y2="322"/><line x1="313" y1="310" x2="313" y2="322"/><line x1="334" y1="310" x2="334" y2="322"/><line x1="355" y1="310" x2="355" y2="322"/>
    <line x1="376" y1="310" x2="376" y2="322"/><line x1="397" y1="310" x2="397" y2="322"/><line x1="418" y1="310" x2="418" y2="322"/><line x1="439" y1="310" x2="439" y2="322"/>
    <line x1="460" y1="310" x2="460" y2="322"/><line x1="481" y1="310" x2="481" y2="322"/><line x1="502" y1="310" x2="502" y2="322"/><line x1="523" y1="310" x2="523" y2="322"/>
    <line x1="544" y1="310" x2="544" y2="322"/><line x1="565" y1="310" x2="565" y2="322"/><line x1="586" y1="310" x2="586" y2="322"/><line x1="607" y1="310" x2="607" y2="322"/>
    <line x1="628" y1="310" x2="628" y2="322"/><line x1="649" y1="310" x2="649" y2="322"/><line x1="670" y1="310" x2="670" y2="322"/><line x1="691" y1="310" x2="691" y2="322"/>
  </g>
  <text x="40" y="336" font-size="11">two-week sprints run continuously underneath every block; each block in the work plan is a tome</text>
</svg>
