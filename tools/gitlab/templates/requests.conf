# requests.conf -- the intake project: one issue per DevSecOps request that arrives in Windchill (the front door).
#
#   perl bin/gitlab.pl --url https://gitlab.example.com --token-env GITLAB_TOKEN setup tools/gitlab/templates/requests.conf
#   perl bin/gitlab.pl --project tidewater/requests windchill intake --conf requests.conf EXPORT.csv     (each refinement)
#   perl bin/gitlab.pl --project tidewater/requests windchill status --conf requests.conf --csv OUT.csv (each review)
#
# Requests live in their own project, beside the model project: the model project's issues stay the team's own work
# (stories and tasks), and the requests keep the requester's words, the disposition and the link to the story that
# delivers each one. Jim (product owner) and the deputy PM disposition every request at refinement: accept (and link
# the story), defer (with the sprint or the condition), or decline (with the reason). Tidewater is fictional.

[project]
path = tidewater/requests
default_branch = main
visibility = private

[members]
jim = maintainer                                          ; product owner: dispositions every request
bob = developer
tom = developer
dpm = reporter                                            ; the deputy PM reads and comments; Jim records the decision

[labels]
source::windchill = #6A5ACD | Imported from a Windchill export by gitlab.pl windchill intake
type::story = #428BCA | A request for something the team builds (the intake's default type)
disposition::accept = #5CB85C | Accepted at refinement: the story that delivers it is linked in a comment
disposition::defer = #F0AD4E | Deferred: the comment says to when, or on what condition
disposition::decline = #D9534F | Declined: the comment gives the reason (and any alternative); closed
workflow::ready = #A8D695 | Dispositioned; waiting for its sprint
workflow::done = #5CB85C | Delivered or declined; closed
priority::1 = #CC0033 | Windchill priority Critical or High
priority::2 = #FC9403 | Windchill priority Medium
priority::3 = #C0C0C0 | Windchill priority Low

[boards]
Requests = disposition::accept disposition::defer disposition::decline | milestone=any

[windchill]
; Requests arrive in Windchill; the team works them in GitLab. gitlab.pl windchill intake EXPORT.csv makes one issue per
; new Windchill number from a report exported as CSV; gitlab.pl windchill status --csv FILE is the progress to send back.
; Column names as the export's header has them (Windchill report or search-result export; adjust to yours):
number = Number
title = Name
state = State
type = Type
requester = Created By
priority = Priority
need-date = Need Date
description = Description
url = https://windchill.example.invalid/Windchill/app/#ptc1/search?keyword={number}   ; the link in each issue
labels = source::windchill, type::story                   ; added to every issue made from a request
accept = Open, Under Review, Approved                     ; states imported; the others are reported as skipped (* = all)
priority-map = Critical=priority::1, High=priority::1, Medium=priority::2, Low=priority::3

